name: Build Usagi Lavender revision 2

on:
  push:
    branches: [main]
    paths:
      - usagi-lavender-theme2-project.zip
      - .github/workflows/build-v2.yml
      - scripts/prepare_v2.py
      - assets/**
      - 200614.png
      - 1794869806252.png
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usagi-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Check project ZIP
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: check
        shell: bash
        run: |
          if [[ -f usagi-lavender-theme2-project.zip ]] && [[ -f 200614.png || -f assets/200614.png ]] && [[ -f 1794869806252.png || -f assets/1794869806252.png ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "### Waiting for revision 2 artwork" >> "$GITHUB_STEP_SUMMARY"
            echo "Upload the replacement background as 200614.png and the selected tab PNG as 1794869806252.png. The next push will build revision 2." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build and verify Android APK
    needs: source
    if: needs.source.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      THEME_VERSION_CODE: 100${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unpack project
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, stat, zipfile
          root = pathlib.Path("build-source").resolve()
          root.mkdir()
          with zipfile.ZipFile("usagi-lavender-theme2-project.zip") as z:
              assert z.testzip() is None, "Corrupt source ZIP"
              assert len(z.infolist()) < 5000, "Unexpected archive file count"
              assert sum(i.file_size for i in z.infolist()) < 100_000_000, "Source ZIP is too large"
              for i in z.infolist():
                  target = (root / i.filename).resolve()
                  assert target.is_relative_to(root), "Unsafe archive path"
                  assert not stat.S_ISLNK(i.external_attr >> 16), "Archive symlinks are not supported"
              z.extractall(root)
          project = root / "usagi-lavender-theme2"
          for name in ["gradlew", "settings.gradle.kts", "app/build.gradle.kts", "scripts/validate_resources.py"]:
              assert (project / name).is_file(), f"Missing project file: {name}"
          (project / "gradlew").chmod(0o755)
          PY
      - name: Apply revision 2 artwork and NinePatch fixes
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 scripts/prepare_v2.py
      - name: Upload revision 2 previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usagi-lavender-v2-previews-${{ github.run_number }}
          path: v2-previews/
          if-no-files-found: ignore
          retention-days: 30
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Restore development signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/debug.keystore
          key: usagi-debug-signing-v1
      - name: Prepare development signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
              -keysize 2048 -validity 10000 -dname "CN=Usagi Lavender Debug"
          fi
      - name: Validate theme resources
        working-directory: build-source/usagi-lavender-theme2
        run: python3 scripts/validate_resources.py
      - name: Build and lint APK
        working-directory: build-source/usagi-lavender-theme2
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Verify signed APK
        working-directory: build-source/usagi-lavender-theme2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/usagi-lavender-debug.apk
          apk=dist/usagi-lavender-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$apk.signature.txt"
          python3 scripts/verify_apk.py "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" > "$apk.badging.txt"
          python3 - <<'PY'
          from pathlib import Path
          text = Path("dist/usagi-lavender-debug.apk.badging.txt").read_text()
          assert "package: name='com.suss3388.usagilavender'" in text, text
          assert "application-label:'우사기 라벤더'" in text, text
          PY
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload installable APK and verification results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usagi-lavender-v2-apk-${{ github.run_number }}
          path: build-source/usagi-lavender-theme2/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usagi-lavender-v2-lint-${{ github.run_number }}
          path: build-source/usagi-lavender-theme2/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Write result
        run: |
          echo '### APK built and signature verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the usagi-lavender-apk artifact and unzip it. Device installation and KakaoTalk layout still need checking.' >> "$GITHUB_STEP_SUMMARY"
