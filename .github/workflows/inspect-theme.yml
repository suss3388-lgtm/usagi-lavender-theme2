name: Inspect applied theme resources
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-theme.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: usagi-lavender-apk-3
          run-id: 43969515372
          github-token: ${{ github.token }}
          path: apk
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Inspect source and compiled resource values
        shell: bash
        run: |
          sdkmanager "build-tools;35.0.0"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump resources apk/usagi-lavender-debug.apk > resources.txt
          python3 - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          names = ["theme_background_color", "theme_header_cell_color", "theme_title_color", "theme_paragraph_color", "theme_body_cell_color", "theme_chatroom_background_color", "theme_background_image", "theme_splash_image", "theme_chatroom_background_image"]
          with zipfile.ZipFile("usagi-lavender-theme2-project.zip") as z:
              print("SOURCE COLOR VARIANTS")
              for n in z.namelist():
                  if n.endswith("/colors.xml"):
                      print(n)
                      for el in ET.fromstring(z.read(n)):
                          if el.attrib.get("name") in names:
                              print(el.attrib["name"], el.text)
          lines = open("resources.txt").read().splitlines()
          print("COMPILED RESOURCE VALUES")
          for i, line in enumerate(lines):
              if any(("/"+name+" ") in line or line.strip().endswith("/"+name) for name in names):
                  print("\n".join(lines[i:i+8]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-theme-resources
          path: resources.txt
