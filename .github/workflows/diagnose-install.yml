name: Diagnose APK installation

on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-install.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact APK supplied to the user
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: usagi-lavender-apk-3
          run-id: 43969515372
          github-token: ${{ github.token }}
          path: apk
      - name: Check original APK checksum
        working-directory: apk
        run: sha256sum --check SHA256SUMS.txt
      - name: Enable KVM on ephemeral runner
        run: sudo chmod a+rw /dev/kvm
      - name: Install and launch on Android 15 without test-only flags
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          script: |
            mkdir -p diagnostics
            adb shell getprop ro.build.version.release | tee diagnostics/android-version.txt
            adb install apk/usagi-lavender-debug.apk 2>&1 | tee diagnostics/install.txt
            grep -x 'Success' diagnostics/install.txt
            adb shell dumpsys package com.suss3388.usagilavender > diagnostics/package.txt
            adb logcat -c
            adb shell am start -W -n com.suss3388.usagilavender/.MainActivity | tee diagnostics/launch.txt
            sleep 3
            adb logcat -d > diagnostics/logcat.txt
            adb shell pidof com.suss3388.usagilavender | tee diagnostics/pid.txt
            test -s diagnostics/pid.txt
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-diagnostics-android-35
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 30
